name: Refresh the atmosphere

on:
  schedule:
    # Once a day is enough for photography; hourly churn burns API quota and
    # fills the commit history. Staggered off the hour to avoid peak load.
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-images
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify the app still boots
        run: npm test

      - name: Curate new photographs
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: node generate-images.js

      - name: Commit refreshed images
        run: |
          if git diff --quiet -- images.json; then
            echo "No changes to images.json — nothing to commit."
            exit 0
          fi
          git config user.name "Minute Muse Bot"
          git config user.email "bot@minutemuse.com"
          git add images.json
          git commit -m "chore: refresh atmospheric photography"
          git push
