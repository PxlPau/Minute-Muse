<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Minute Muse</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- EFFECTS -->
  <div class="grain"></div>
  <div class="rain" id="rain-effect"></div>

  <!-- SINGLE AUDIO PLAYER (Source set by JS) -->
  <audio id="bgm-player" loop preload="auto"></audio>

  <main class="app" id="app-container">
    
    <header class="header-area">
      <h1 id="greeting">Hello, Traveler</h1>
      <!-- SECRET TRIGGER: Click this 5 times to open Admin Mode -->
      <div class="season-badge" id="season-badge">Detecting Season...</div>
    </header>

    <div class="card" id="quote-card">
      <div class="meta">
        <div class="time" id="time">--:--</div>
        <div class="period" id="period">Loading…</div>
      </div>

      <blockquote class="quote" id="quote">Loading story…</blockquote>
      <cite class="author" id="author"></cite>

      <!-- TOOLBAR -->
      <div class="toolbar">
        <button id="btn-sound" class="tool-btn" title="Toggle Sound">
          <span class="icon">🔇</span>
        </button>
        <!-- NEW: Music Menu Trigger -->
        <button id="btn-music-menu" class="tool-btn" title="Select Track">
          <span class="icon">🎵</span>
        </button>
        <button id="btn-zen" class="tool-btn" title="Zen Mode">
          <span class="icon">👁️</span>
        </button>
        <button id="btn-journal" class="tool-btn" title="Open Journal">
          <span class="icon">✏️</span>
        </button>
        <button id="new-quote" class="tool-btn" title="New Vibe">
          <span class="icon">↻</span>
        </button>
      </div>

      <!-- NEW: POPUP MUSIC MENU -->
      <div id="music-menu" class="music-menu hidden">
        <div class="music-header">Select Ambience</div>
        <ul id="track-list">
          <!-- Tracks injected by JS -->
        </ul>
      </div>

      <div class="next-change" id="next-change">...</div>

      <div class="attribution">
        <span id="photo-credit">Atmosphere via Unsplash</span>
        <span class="separator">&bull;</span>
        Quotes from <a href="https://github.com/JohannesNE/literature-clock" target="_blank">Literature Clock</a>
        <br>
        <span style="font-size: 0.65rem; opacity: 0.7; margin-top: 5px; display: inline-block;">
          <a href="terms.html">Terms</a> &bull; 
          <a href="privacy.html">Privacy</a> &bull; 
          <a href="disclaimer.html">Disclaimer</a>
        </span>
      </div>
    </div>

    <!-- JOURNAL OVERLAY -->
    <div id="journal-overlay" class="overlay hidden">
      <div class="modal-card">
        <h2>Your Thoughts</h2>
        <textarea id="journal-text" placeholder="What does this quote make you feel?"></textarea>
        <button id="btn-close-journal" class="btn-primary">Save & Close</button>
      </div>
    </div>

    <!-- ADMIN OVERLAY -->
    <div id="admin-overlay" class="overlay hidden">
      <div class="modal-card">
        <h2>🔧 Admin Control</h2>
        <p>Force Location / Season</p>
        <select id="admin-location-select">
          <option value="auto">Auto Detect (Default)</option>
          <option value="tropical">Force Tropical (Singapore)</option>
          <option value="north_winter">Force North Winter (London)</option>
          <option value="north_summer">Force North Summer (New York)</option>
          <option value="south_summer">Force South Summer (Sydney)</option>
          <option value="south_winter">Force South Winter (Melbourne)</option>
        </select>
        <button id="btn-close-admin" class="btn-primary" style="margin-top:10px;">Apply & Reload</button>
      </div>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
